<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>요트다이스</title>
<style>
  :root {
    --bg: #0a0f0d;
    --panel: #14201b;
    --panel-border: #26382f;
    --card: #182620;
    --card-border: #2c4238;
    --text: #f2f2f0;
    --muted: #8fa39a;
    --gold: #ffd166;
    --green: #3ddc84;
    --red: #ff6b5b;
    --blue: #4a90ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: radial-gradient(ellipse at top, #16261f 0%, var(--bg) 65%);
    color: var(--text); font-family: -apple-system, "Segoe UI", "Pretendard", "Malgun Gothic", sans-serif;
    overscroll-behavior: none; user-select: none; min-height: 100%;
  }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  .screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; padding: 20px 16px 40px; }
  .screen.active { display: flex; }

  h1 { font-size: 26px; margin: 4px 0 2px; letter-spacing: 0.5px; }
  h1 .dice-emoji { filter: drop-shadow(0 2px 6px rgba(255,209,102,.4)); }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; text-align: center; }

  /* ---------- Setup screen ---------- */
  #setup-screen { max-width: 460px; margin: 0 auto; width: 100%; }
  .setup-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 18px; padding: 20px; width: 100%; }
  .count-row { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 18px; }
  .count-btn {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--card-border);
    background: var(--card); color: var(--text); font-size: 22px; display: flex; align-items: center; justify-content: center;
  }
  .count-btn:active { background: #223129; }
  #playerCountLabel { font-size: 20px; font-weight: 700; min-width: 84px; text-align: center; }
  .name-inputs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .name-inputs input {
    background: #0c1512; border: 1px solid var(--card-border); color: var(--text);
    border-radius: 10px; padding: 12px 14px; font-size: 16px;
  }
  .name-inputs input:focus { outline: none; border-color: var(--gold); }
  #startBtn {
    width: 100%; padding: 16px; font-size: 18px; font-weight: 700; border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--gold), #f4a53a); color: #17170b; box-shadow: 0 6px 18px rgba(255,209,102,.25);
  }
  #startBtn:active { transform: translateY(1px); }
  .rules-hint { color: var(--muted); font-size: 12.5px; margin-top: 16px; line-height: 1.6; text-align: center; }

  /* ---------- Game screen ---------- */
  #game-screen { width: 100%; max-width: 980px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 10px; gap: 8px; }
  .topbar .title { font-size: 15px; color: var(--muted); font-weight: 600; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 10px; padding: 8px 12px; font-size: 14px; display: flex; align-items: center; gap: 4px;
  }
  .icon-btn:active { background: #223129; }

  .turn-banner {
    width: 100%; text-align: center; padding: 12px 10px; border-radius: 16px; margin-bottom: 14px;
    background: linear-gradient(135deg, rgba(255,209,102,.14), rgba(61,220,132,.10));
    border: 1px solid var(--card-border);
  }
  .turn-banner .who { font-size: 22px; font-weight: 800; color: var(--gold); }
  .turn-banner .who::after { content: "님 차례"; font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 6px; }

  .dice-area {
    width: 100%; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 18px;
    padding: 18px 14px; display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 16px;
  }
  .dice-row { display: flex; gap: clamp(8px, 2.5vw, 16px); justify-content: center; flex-wrap: wrap; }
  .die {
    width: clamp(56px, 13vw, 78px); height: clamp(56px, 13vw, 78px);
    background: #f4efe4; border-radius: 14px; display: grid;
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    padding: 10%; box-shadow: 0 4px 0 #c9beA0, 0 8px 16px rgba(0,0,0,.35);
    transition: transform .15s, box-shadow .15s, opacity .2s; position: relative; touch-action: none;
  }
  .die.disabled { opacity: .35; }
  .die.held { transform: translateY(-10px); box-shadow: 0 2px 0 var(--gold), 0 10px 20px rgba(255,209,102,.35); background: #fff6df; }
  .die.held::after {
    content: "고정"; position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: var(--gold); font-weight: 800; letter-spacing: 1px;
  }
  .die.rolling { animation: dieShake .3s linear infinite; }
  @keyframes dieShake {
    0% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-8deg) scale(1.04); }
    50% { transform: rotate(6deg) scale(0.98); }
    75% { transform: rotate(-4deg) scale(1.03); }
    100% { transform: rotate(0deg) scale(1); }
  }
  .die.dragging-source { opacity: .5; }
  .pip { border-radius: 50%; align-self: center; justify-self: center; width: 68%; height: 68%; background: transparent; }
  .pip.active { background: #2a2118; }

  .dice-hint { color: var(--muted); font-size: 12.5px; text-align: center; }
  .roll-controls { display: flex; align-items: center; gap: 14px; }
  .rolls-pips { display: flex; gap: 6px; }
  .rolls-pips .p { width: 9px; height: 9px; border-radius: 50%; background: #2c4238; }
  .rolls-pips .p.used { background: var(--gold); }
  #rollBtn {
    padding: 14px 30px; font-size: 17px; font-weight: 800; border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--green), #21a35e); color: #06170d;
    box-shadow: 0 6px 16px rgba(61,220,132,.25);
  }
  #rollBtn:disabled { background: #263a31; color: #5c7268; box-shadow: none; }
  #rollBtn:active:not(:disabled) { transform: translateY(1px); }

  /* ---------- Scorecard ---------- */
  .scorecard-wrap { width: 100%; overflow-x: auto; border-radius: 16px; border: 1px solid var(--panel-border); background: var(--panel); }
  table.scorecard { border-collapse: collapse; width: 100%; min-width: 100%; }
  table.scorecard th, table.scorecard td {
    padding: 0; text-align: center; border-bottom: 1px solid var(--card-border); white-space: nowrap;
  }
  table.scorecard thead th {
    position: sticky; top: 0; background: var(--panel); z-index: 2; padding: 10px 8px; font-size: 13px; color: var(--muted); font-weight: 600;
  }
  table.scorecard thead th.player-col.active-col { color: var(--gold); }
  table.scorecard th.cat-col, table.scorecard td.cat-col {
    position: sticky; left: 0; background: var(--panel); z-index: 1; text-align: left; padding: 10px 12px;
    font-size: 13.5px; min-width: 118px; border-right: 1px solid var(--card-border);
  }
  table.scorecard td.cat-col .desc { display: block; font-size: 10.5px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  tr.section-row td { background: #10190f; color: var(--muted); font-size: 11.5px; font-weight: 700; padding: 6px 12px; letter-spacing: .5px; }
  tr.subtotal-row td, tr.total-row td { background: #101b15; font-weight: 700; }
  tr.total-row td { color: var(--gold); font-size: 15px; }

  td.score-cell { min-width: 76px; font-size: 15px; font-weight: 600; height: 48px; position: relative; }
  td.score-cell .val.zero { color: #63756c; font-weight: 400; }
  td.score-cell.open-active { background: rgba(255,209,102,.06); }
  td.score-cell.open-active .val.empty { color: #4a5c53; font-size: 13px; }
  td.score-cell.preview .val { color: var(--gold); opacity: .55; font-style: italic; }
  td.score-cell.drop-hover { background: rgba(255,209,102,.28) !important; outline: 2px dashed var(--gold); outline-offset: -3px; }
  td.score-cell.drop-hover .val { opacity: 1; color: #17170b; font-weight: 800; }

  /* ---------- Drag ghost ---------- */
  #dragGhost {
    position: fixed; pointer-events: none; z-index: 999; display: none;
    background: #1c2b23; border: 1px solid var(--gold); border-radius: 12px; padding: 8px 12px;
    font-size: 15px; font-weight: 700; color: var(--gold); box-shadow: 0 10px 24px rgba(0,0,0,.5);
    transform: translate(-50%, -130%);
  }

  /* ---------- Modals ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 500; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 18px; padding: 24px 22px;
    max-width: 420px; width: 100%; text-align: center;
  }
  .modal-box h2 { margin: 0 0 10px; font-size: 20px; }
  .modal-box p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button {
    flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--card); color: var(--text); font-size: 15px; font-weight: 600;
  }
  .modal-btns button.primary { background: linear-gradient(135deg, var(--gold), #f4a53a); color: #17170b; border: none; }

  .rank-list { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 18px; text-align: left; }
  .rank-item { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 14px; }
  .rank-item.first { border-color: var(--gold); background: rgba(255,209,102,.1); }
  .rank-item .medal { font-size: 20px; width: 26px; text-align: center; }
  .rank-item .name { flex: 1; font-weight: 700; }
  .rank-item .score { font-weight: 800; color: var(--gold); font-size: 17px; }

  .mute-btn { font-size: 16px; }
</style>
</head>
<body>

  <!-- ============ 이어하기 안내 모달 ============ -->
  <div class="modal-overlay" id="resumeModal">
    <div class="modal-box">
      <h2>🎲 저장된 게임이 있어요</h2>
      <p>진행 중이던 요트다이스 게임을 이어서 하시겠습니까?</p>
      <div class="modal-btns">
        <button id="resumeNewBtn">새 게임</button>
        <button id="resumeContinueBtn" class="primary">이어하기</button>
      </div>
    </div>
  </div>

  <!-- ============ 결과 모달 ============ -->
  <div class="modal-overlay" id="resultModal">
    <div class="modal-box">
      <h2>🏆 게임 종료</h2>
      <div class="rank-list" id="rankList"></div>
      <div class="modal-btns">
        <button id="resultNewGameBtn" class="primary">새 게임 시작</button>
      </div>
    </div>
  </div>

  <!-- ============ 설정 화면 ============ -->
  <div class="screen active" id="setup-screen">
    <h1><span class="dice-emoji">🎲</span> 요트다이스</h1>
    <div class="subtitle">태블릿 한 대를 돌려가며 즐기는 표준 요트다이스</div>
    <div class="setup-card">
      <div class="count-row">
        <button class="count-btn" id="countMinus">−</button>
        <div id="playerCountLabel">2명</div>
        <button class="count-btn" id="countPlus">+</button>
      </div>
      <div class="name-inputs" id="nameInputs"></div>
      <button id="startBtn">게임 시작</button>
      <div class="rules-hint">
        주사위 5개, 한 턴에 최대 3번 굴릴 수 있어요. 굴린 뒤 주사위를 톡 누르면 고정,<br>
        마음에 드는 조합이 나오면 주사위를 <b>점수칸으로 끌어다 놓아</b> 확정합니다.<br>
        상단(1~6) 합계가 63점 넘으면 보너스 35점!
      </div>
    </div>
  </div>

  <!-- ============ 게임 화면 ============ -->
  <div class="screen" id="game-screen">
    <div class="topbar">
      <div class="title">🎲 요트다이스</div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn mute-btn" id="muteBtn">🔊</button>
        <button class="icon-btn" id="restartBtn">↺ 새 게임</button>
      </div>
    </div>

    <div class="turn-banner"><span class="who" id="turnWho">-</span></div>

    <div class="dice-area">
      <div class="dice-row" id="diceRow"></div>
      <div class="dice-hint" id="diceHint">굴리기를 눌러 시작하세요</div>
      <div class="roll-controls">
        <div class="rolls-pips" id="rollsPips"><span class="p"></span><span class="p"></span><span class="p"></span></div>
        <button id="rollBtn">🎲 굴리기</button>
      </div>
    </div>

    <div class="scorecard-wrap">
      <table class="scorecard" id="scorecardTable"></table>
    </div>
  </div>

  <div id="dragGhost"></div>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // 점수 카테고리 정의 및 계산
  // ---------------------------------------------------------------
  var CATEGORIES = [
    { id:'aces',   label:'1', section:'upper', num:1, desc:'1이 나온 눈의 합' },
    { id:'twos',   label:'2', section:'upper', num:2, desc:'2가 나온 눈의 합' },
    { id:'threes', label:'3', section:'upper', num:3, desc:'3이 나온 눈의 합' },
    { id:'fours',  label:'4', section:'upper', num:4, desc:'4가 나온 눈의 합' },
    { id:'fives',  label:'5', section:'upper', num:5, desc:'5가 나온 눈의 합' },
    { id:'sixes',  label:'6', section:'upper', num:6, desc:'6이 나온 눈의 합' },
    { id:'choice',       label:'초이스',        section:'lower', desc:'주사위 5개 합' },
    { id:'fourkind',     label:'포카드',        section:'lower', desc:'4개 이상 같으면 합계' },
    { id:'fullhouse',    label:'풀하우스',      section:'lower', desc:'3개+2개 조합, 합계' },
    { id:'smallstraight',label:'스몰 스트레이트', section:'lower', desc:'연속된 눈 4개, 15점' },
    { id:'largestraight',label:'라지 스트레이트', section:'lower', desc:'연속된 눈 5개, 30점' },
    { id:'yacht',        label:'요트',          section:'lower', desc:'5개 모두 같음, 50점' },
  ];
  var UPPER_IDS = CATEGORIES.filter(function(c){ return c.section === 'upper'; }).map(function(c){ return c.id; });
  var LOWER_IDS = CATEGORIES.filter(function(c){ return c.section === 'lower'; }).map(function(c){ return c.id; });
  var UPPER_BONUS_THRESHOLD = 63;
  var UPPER_BONUS_VALUE = 35;

  function computeScore(catId, dice) {
    var counts = [0,0,0,0,0,0,0];
    dice.forEach(function(d){ counts[d]++; });
    var sum = dice.reduce(function(a,b){ return a+b; }, 0);
    switch (catId) {
      case 'aces':   return counts[1] * 1;
      case 'twos':   return counts[2] * 2;
      case 'threes': return counts[3] * 3;
      case 'fours':  return counts[4] * 4;
      case 'fives':  return counts[5] * 5;
      case 'sixes':  return counts[6] * 6;
      case 'choice': return sum;
      case 'fourkind': {
        var maxCount = Math.max(counts[1],counts[2],counts[3],counts[4],counts[5],counts[6]);
        return maxCount >= 4 ? sum : 0;
      }
      case 'fullhouse': {
        var cs = [counts[1],counts[2],counts[3],counts[4],counts[5],counts[6]];
        return (cs.indexOf(3) !== -1 && cs.indexOf(2) !== -1) ? sum : 0;
      }
      case 'smallstraight': {
        var uniq = {}; dice.forEach(function(d){ uniq[d]=true; });
        var seqs = [[1,2,3,4],[2,3,4,5],[3,4,5,6]];
        var ok = seqs.some(function(s){ return s.every(function(v){ return uniq[v]; }); });
        return ok ? 15 : 0;
      }
      case 'largestraight': {
        var sorted = dice.slice().sort(function(a,b){ return a-b; }).join(',');
        return (sorted === '1,2,3,4,5' || sorted === '2,3,4,5,6') ? 30 : 0;
      }
      case 'yacht': {
        var cs2 = [counts[1],counts[2],counts[3],counts[4],counts[5],counts[6]];
        return cs2.indexOf(5) !== -1 ? 50 : 0;
      }
    }
    return 0;
  }

  function playerUpperSum(p) {
    return UPPER_IDS.reduce(function(a,id){ return a + (id in p.scores ? p.scores[id] : 0); }, 0);
  }
  function playerBonus(p) {
    return playerUpperSum(p) >= UPPER_BONUS_THRESHOLD ? UPPER_BONUS_VALUE : 0;
  }
  function playerLowerSum(p) {
    return LOWER_IDS.reduce(function(a,id){ return a + (id in p.scores ? p.scores[id] : 0); }, 0);
  }
  function playerTotal(p) {
    return playerUpperSum(p) + playerBonus(p) + playerLowerSum(p);
  }
  function playerDone(p) {
    return CATEGORIES.every(function(c){ return c.id in p.scores; });
  }

  // ---------------------------------------------------------------
  // 사운드 (외부 파일 없이 Web Audio API로 직접 합성)
  // ---------------------------------------------------------------
  var audioCtx = null;
  var muted = false;
  function ensureAudio() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(time, freq, dur, type, gainVal) {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(gainVal || 0.18, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + dur);
  }
  function noiseBurst(time, dur, gainVal) {
    if (!audioCtx) return;
    var size = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
    var buffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / size);
    var src = audioCtx.createBufferSource();
    src.buffer = buffer;
    var filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(1200 + Math.random() * 2600, time);
    var gain = audioCtx.createGain();
    gain.gain.setValueAtTime(gainVal || 0.22, time);
    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start(time);
  }
  function playRollSound() {
    if (muted) return;
    ensureAudio();
    if (!audioCtx) return;
    var now = audioCtx.currentTime;
    var bursts = 6 + Math.floor(Math.random() * 3);
    for (var i = 0; i < bursts; i++) {
      noiseBurst(now + i * 0.085 + Math.random() * 0.02, 0.05, 0.18);
    }
    tone(now + bursts * 0.085 + 0.03, 90, 0.18, 'sine', 0.22);
  }
  function playTapSound() {
    if (muted) return;
    ensureAudio();
    if (!audioCtx) return;
    tone(audioCtx.currentTime, 520, 0.08, 'square', 0.1);
  }
  function playConfirmSound() {
    if (muted) return;
    ensureAudio();
    if (!audioCtx) return;
    var now = audioCtx.currentTime;
    tone(now, 660, 0.12, 'sine', 0.2);
    tone(now + 0.08, 880, 0.16, 'sine', 0.18);
  }
  function playTurnChangeSound() {
    if (muted) return;
    ensureAudio();
    if (!audioCtx) return;
    var now = audioCtx.currentTime;
    tone(now, 523, 0.1, 'triangle', 0.14);
    tone(now + 0.09, 659, 0.1, 'triangle', 0.14);
  }
  function playWinSound() {
    if (muted) return;
    ensureAudio();
    if (!audioCtx) return;
    var now = audioCtx.currentTime;
    [523, 659, 784, 1047].forEach(function(f, i){
      tone(now + i * 0.13, f, 0.28, 'triangle', 0.2);
    });
  }
  function playDropRejectSound() {
    if (muted) return;
    ensureAudio();
    if (!audioCtx) return;
    tone(audioCtx.currentTime, 180, 0.14, 'sawtooth', 0.12);
  }

  // ---------------------------------------------------------------
  // 상태
  // ---------------------------------------------------------------
  var STORAGE_KEY = 'yachtDiceState_v1';
  var state = null;
  var animating = false;

  function freshState() {
    return { phase: 'setup', players: [], currentIndex: 0, dice: [1,1,1,1,1], held: [false,false,false,false,false], rollsUsed: 0 };
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function loadSaved() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.players || !parsed.players.length) return null;
      return parsed;
    } catch (e) { return null; }
  }
  function clearSaved() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  function resetTurn() {
    state.dice = [1,1,1,1,1];
    state.held = [false,false,false,false,false];
    state.rollsUsed = 0;
  }

  function startGame(names) {
    state = freshState();
    state.players = names.map(function(n){ return { name: n, scores: {} }; });
    state.currentIndex = 0;
    state.phase = 'playing';
    resetTurn();
    save();
    showScreen('game-screen');
    renderGame();
  }

  function advanceTurn() {
    if (state.players.every(playerDone)) {
      state.phase = 'finished';
      save();
      playWinSound();
      showResult();
      renderGame();
      return;
    }
    var idx = state.currentIndex;
    do {
      idx = (idx + 1) % state.players.length;
    } while (playerDone(state.players[idx]));
    state.currentIndex = idx;
    resetTurn();
    playTurnChangeSound();
    save();
    renderGame();
  }

  function confirmScore(catId) {
    var player = state.players[state.currentIndex];
    if (!player || player.scores.hasOwnProperty(catId)) return false;
    if (state.rollsUsed < 1) return false;
    var val = computeScore(catId, state.dice);
    player.scores[catId] = val;
    playConfirmSound();
    advanceTurn();
    return true;
  }

  // ---------------------------------------------------------------
  // 화면 전환
  // ---------------------------------------------------------------
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(el){ el.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  // ---------------------------------------------------------------
  // 설정 화면
  // ---------------------------------------------------------------
  var playerCount = 2;
  var MIN_PLAYERS = 1, MAX_PLAYERS = 8;
  var nameInputsEl = document.getElementById('nameInputs');
  var playerCountLabelEl = document.getElementById('playerCountLabel');

  function renderNameInputs() {
    var existing = Array.prototype.map.call(nameInputsEl.querySelectorAll('input'), function(i){ return i.value; });
    nameInputsEl.innerHTML = '';
    for (var i = 0; i < playerCount; i++) {
      var input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 10;
      input.placeholder = '플레이어 ' + (i + 1);
      input.value = existing[i] || '';
      nameInputsEl.appendChild(input);
    }
    playerCountLabelEl.textContent = playerCount + '명';
  }
  document.getElementById('countMinus').addEventListener('click', function(){
    if (playerCount > MIN_PLAYERS) { playerCount--; renderNameInputs(); }
  });
  document.getElementById('countPlus').addEventListener('click', function(){
    if (playerCount < MAX_PLAYERS) { playerCount++; renderNameInputs(); }
  });
  renderNameInputs();

  document.getElementById('startBtn').addEventListener('click', function(){
    ensureAudio();
    var inputs = nameInputsEl.querySelectorAll('input');
    var names = Array.prototype.map.call(inputs, function(inp, i){
      var v = inp.value.trim();
      return v || ('플레이어 ' + (i + 1));
    });
    startGame(names);
  });

  // ---------------------------------------------------------------
  // 주사위 렌더 / 굴리기
  // ---------------------------------------------------------------
  var PIP_MAP = {
    1: [5],
    2: [1,9],
    3: [1,5,9],
    4: [1,3,7,9],
    5: [1,3,5,7,9],
    6: [1,3,4,6,7,9],
  };
  var diceRowEl = document.getElementById('diceRow');
  var diceEls = [];

  function buildDiceRow() {
    diceRowEl.innerHTML = '';
    diceEls = [];
    for (var i = 0; i < 5; i++) {
      var die = document.createElement('div');
      die.className = 'die disabled';
      die.dataset.index = i;
      for (var p = 1; p <= 9; p++) {
        var pip = document.createElement('span');
        pip.className = 'pip';
        pip.dataset.pos = p;
        die.appendChild(pip);
      }
      diceRowEl.appendChild(die);
      diceEls.push(die);
      attachDieDrag(die, i);
    }
  }
  function setDieFace(die, value) {
    var active = PIP_MAP[value] || [];
    var pips = die.querySelectorAll('.pip');
    pips.forEach(function(pip){
      var pos = parseInt(pip.dataset.pos, 10);
      pip.classList.toggle('active', active.indexOf(pos) !== -1);
    });
  }

  function renderDice() {
    for (var i = 0; i < 5; i++) {
      var die = diceEls[i];
      setDieFace(die, state.dice[i]);
      die.classList.toggle('held', state.rollsUsed > 0 && state.held[i]);
      die.classList.toggle('disabled', state.rollsUsed === 0 || animating);
    }
    var diceHint = document.getElementById('diceHint');
    if (animating) {
      diceHint.textContent = '굴리는 중...';
    } else if (state.rollsUsed === 0) {
      diceHint.textContent = '굴리기를 눌러 시작하세요';
    } else if (state.rollsUsed < 3) {
      diceHint.textContent = '주사위를 톡 누르면 고정 · 마음에 들면 점수칸으로 끌어다 놓으세요';
    } else {
      diceHint.textContent = '더 굴릴 수 없어요 · 점수칸으로 끌어다 놓아 확정하세요';
    }
    var pips = document.querySelectorAll('#rollsPips .p');
    pips.forEach(function(p, idx){ p.classList.toggle('used', idx < state.rollsUsed); });
    var rollBtn = document.getElementById('rollBtn');
    rollBtn.disabled = state.rollsUsed >= 3 || animating;
    rollBtn.textContent = state.rollsUsed === 0 ? '🎲 굴리기' : '🎲 다시 굴리기 (' + state.rollsUsed + '/3)';
  }

  function doRoll() {
    if (animating || state.rollsUsed >= 3) return;
    animating = true;
    renderDice();
    playRollSound();
    var finalValues = state.dice.map(function(v, i){
      return state.held[i] ? v : (1 + Math.floor(Math.random() * 6));
    });
    diceEls.forEach(function(die, i){
      if (!(state.rollsUsed > 0 && state.held[i])) die.classList.add('rolling');
    });
    var ticks = 0, maxTicks = 8;
    var interval = setInterval(function(){
      ticks++;
      diceEls.forEach(function(die, i){
        if (state.rollsUsed > 0 && state.held[i]) return;
        setDieFace(die, 1 + Math.floor(Math.random() * 6));
      });
      if (ticks >= maxTicks) {
        clearInterval(interval);
        diceEls.forEach(function(die){ die.classList.remove('rolling'); });
        state.dice = finalValues;
        state.rollsUsed++;
        animating = false;
        save();
        renderGame();
      }
    }, 70);
  }
  document.getElementById('rollBtn').addEventListener('click', doRoll);

  // ---- 탭(고정 토글) / 드래그(점수 확정) 구분 처리 ----
  var DRAG_THRESHOLD = 12;
  var dragGhostEl = document.getElementById('dragGhost');

  function attachDieDrag(die, index) {
    var startX = 0, startY = 0, pointerId = null, isDragging = false, downOnValidDie = false;
    var hoverCell = null;
    var cachedCells = [];

    die.addEventListener('pointerdown', function(e){
      if (animating || state.rollsUsed === 0) return;
      downOnValidDie = true;
      isDragging = false;
      pointerId = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      try { die.setPointerCapture(pointerId); } catch (err) {}
    });

    die.addEventListener('pointermove', function(e){
      if (!downOnValidDie || pointerId === null) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (!isDragging && Math.sqrt(dx*dx + dy*dy) > DRAG_THRESHOLD) {
        isDragging = true;
        beginDrag();
      }
      if (isDragging) {
        updateDrag(e.clientX, e.clientY);
      }
    });

    function beginDrag() {
      diceEls.forEach(function(d){ d.classList.add('dragging-source'); });
      dragGhostEl.textContent = '🎲 ' + state.dice.join(' · ');
      dragGhostEl.style.display = 'block';
      var player = state.players[state.currentIndex];
      cachedCells = [];
      CATEGORIES.forEach(function(cat){
        if (player.scores.hasOwnProperty(cat.id)) return;
        var cell = document.querySelector('.score-cell[data-player="' + state.currentIndex + '"][data-cat="' + cat.id + '"]');
        if (!cell) return;
        var preview = computeScore(cat.id, state.dice);
        cell.classList.add('preview');
        var valEl = cell.querySelector('.val');
        if (valEl) valEl.textContent = preview;
        cachedCells.push({ cat: cat.id, cell: cell });
      });
    }

    function updateDrag(x, y) {
      dragGhostEl.style.left = x + 'px';
      dragGhostEl.style.top = y + 'px';
      var el = document.elementFromPoint(x, y);
      var cellMatch = null;
      if (el) {
        var found = el.closest ? el.closest('.score-cell') : null;
        if (found) {
          var match = cachedCells.filter(function(c){ return c.cell === found; })[0];
          if (match) cellMatch = match.cell;
        }
      }
      if (hoverCell !== cellMatch) {
        if (hoverCell) hoverCell.classList.remove('drop-hover');
        if (cellMatch) cellMatch.classList.add('drop-hover');
        hoverCell = cellMatch;
      }
    }

    function endDrag(committed) {
      diceEls.forEach(function(d){ d.classList.remove('dragging-source'); });
      dragGhostEl.style.display = 'none';
      var targetCatId = null;
      if (hoverCell) targetCatId = hoverCell.dataset.cat;
      cachedCells.forEach(function(c){ c.cell.classList.remove('preview'); c.cell.classList.remove('drop-hover'); });
      hoverCell = null;
      cachedCells = [];
      if (committed && targetCatId) {
        var ok = confirmScore(targetCatId);
        if (!ok) { playDropRejectSound(); renderGame(); }
      } else {
        renderGame();
      }
    }

    die.addEventListener('pointerup', function(e){
      if (!downOnValidDie) return;
      if (isDragging) {
        endDrag(true);
      } else {
        // 탭: 고정 토글
        if (!animating && state.rollsUsed > 0 && state.rollsUsed < 3) {
          state.held[index] = !state.held[index];
          playTapSound();
          save();
          renderGame();
        }
      }
      downOnValidDie = false; isDragging = false; pointerId = null;
    });

    die.addEventListener('pointercancel', function(){
      if (isDragging) endDrag(false);
      downOnValidDie = false; isDragging = false; pointerId = null;
    });
  }

  // ---------------------------------------------------------------
  // 스코어카드 렌더
  // ---------------------------------------------------------------
  function renderScorecard() {
    var table = document.getElementById('scorecardTable');
    var html = '';
    html += '<thead><tr><th class="cat-col">항목</th>';
    state.players.forEach(function(p, i){
      var activeClass = (i === state.currentIndex && state.phase === 'playing') ? ' active-col' : '';
      html += '<th class="player-col' + activeClass + '">' + escapeHtml(p.name) + (playerDone(p) ? ' ✓' : '') + '</th>';
    });
    html += '</tr></thead><tbody>';

    html += '<tr class="section-row"><td colspan="' + (state.players.length + 1) + '">상단 (같은 눈 합계)</td></tr>';
    CATEGORIES.filter(function(c){ return c.section === 'upper'; }).forEach(function(cat){
      html += renderCatRow(cat);
    });
    html += '<tr class="subtotal-row"><td class="cat-col">소계</td>';
    state.players.forEach(function(p){ html += '<td>' + playerUpperSum(p) + '</td>'; });
    html += '</tr>';
    html += '<tr class="subtotal-row"><td class="cat-col">보너스<span class="desc">63점 이상 시 +35</span></td>';
    state.players.forEach(function(p){ html += '<td>' + playerBonus(p) + '</td>'; });
    html += '</tr>';

    html += '<tr class="section-row"><td colspan="' + (state.players.length + 1) + '">하단</td></tr>';
    CATEGORIES.filter(function(c){ return c.section === 'lower'; }).forEach(function(cat){
      html += renderCatRow(cat);
    });

    html += '<tr class="total-row"><td class="cat-col">총점</td>';
    state.players.forEach(function(p){ html += '<td>' + playerTotal(p) + '</td>'; });
    html += '</tr>';

    html += '</tbody>';
    table.innerHTML = html;
  }

  function renderCatRow(cat) {
    var row = '<tr><td class="cat-col">' + cat.label + '<span class="desc">' + cat.desc + '</span></td>';
    state.players.forEach(function(p, i){
      var filled = p.scores.hasOwnProperty(cat.id);
      var isActiveTarget = (i === state.currentIndex && state.phase === 'playing' && !filled && state.rollsUsed > 0);
      var cls = 'score-cell' + (isActiveTarget ? ' open-active' : '');
      var content;
      if (filled) {
        var v = p.scores[cat.id];
        content = '<span class="val' + (v === 0 ? ' zero' : '') + '">' + v + '</span>';
      } else {
        content = '<span class="val empty">-</span>';
      }
      row += '<td class="' + cls + '" data-player="' + i + '" data-cat="' + cat.id + '">' + content + '</td>';
    });
    row += '</tr>';
    return row;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // ---------------------------------------------------------------
  // 전체 렌더
  // ---------------------------------------------------------------
  function renderGame() {
    if (!state) return;
    var current = state.players[state.currentIndex];
    document.getElementById('turnWho').textContent = current ? current.name : '-';
    renderDice();
    renderScorecard();
  }

  function showResult() {
    var ranked = state.players.slice().map(function(p){
      return { name: p.name, total: playerTotal(p) };
    }).sort(function(a,b){ return b.total - a.total; });
    var medals = ['🥇','🥈','🥉'];
    var html = '';
    ranked.forEach(function(r, i){
      html += '<div class="rank-item' + (i === 0 ? ' first' : '') + '">' +
        '<div class="medal">' + (medals[i] || (i+1)) + '</div>' +
        '<div class="name">' + escapeHtml(r.name) + '</div>' +
        '<div class="score">' + r.total + '점</div></div>';
    });
    document.getElementById('rankList').innerHTML = html;
    document.getElementById('resultModal').classList.add('show');
  }

  // ---------------------------------------------------------------
  // 컨트롤 버튼들
  // ---------------------------------------------------------------
  document.getElementById('muteBtn').addEventListener('click', function(){
    muted = !muted;
    this.textContent = muted ? '🔇' : '🔊';
  });

  document.getElementById('restartBtn').addEventListener('click', function(){
    if (confirm('정말 새 게임을 시작할까요? 현재 진행 상황이 사라집니다.')) {
      clearSaved();
      state = null;
      showScreen('setup-screen');
    }
  });

  document.getElementById('resultNewGameBtn').addEventListener('click', function(){
    document.getElementById('resultModal').classList.remove('show');
    clearSaved();
    state = null;
    showScreen('setup-screen');
  });

  document.getElementById('resumeNewBtn').addEventListener('click', function(){
    document.getElementById('resumeModal').classList.remove('show');
    clearSaved();
    showScreen('setup-screen');
  });
  document.getElementById('resumeContinueBtn').addEventListener('click', function(){
    document.getElementById('resumeModal').classList.remove('show');
    ensureAudio();
    showScreen('game-screen');
    renderGame();
    if (state.phase === 'finished') showResult();
  });

  // ---------------------------------------------------------------
  // 초기화
  // ---------------------------------------------------------------
  buildDiceRow();
  var saved = loadSaved();
  if (saved && (saved.phase === 'playing' || saved.phase === 'finished')) {
    state = saved;
    document.getElementById('resumeModal').classList.add('show');
  }
})();
</script>
</body>
</html>
