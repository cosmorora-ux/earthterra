<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=42dot+Sans:wght@300..800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
  @font-face { font-family:"Baunk"; font-display:swap; src: url("/static/fonts/Baunk.ttf") format("truetype"); }
  :root {
    color-scheme: dark;
    --bg:#050505; --panel:#141416; --panel-border:#262629; --card:#17171a; --card-border:#2a2a2e;
    --text:#f2f2f2; --muted:#8b8b90; --accent-blue:#0043FF; --accent-red:#e2574a;
    --font-title: "Baunk", "42dot Sans", "Pretendard", sans-serif;
  }
  * { box-sizing:border-box; }
  input, select, textarea, button { font-family: inherit; }
  body { font-family: "42dot Sans", "Pretendard", "Malgun Gothic", sans-serif; margin:0; background: var(--bg); color: var(--text); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 56px 20px 64px; }
  .head { margin-bottom: 28px; }
  .head h1 { font-family: var(--font-title); font-weight:400; font-size: 34px; letter-spacing:.02em; margin:0 0 8px; }
  .head p { margin:0; color: var(--muted); font-size:15px; }
  .sec-title { display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700; color: var(--muted); letter-spacing:.08em; margin: 0 0 12px; }
  .sec-title .count { color: var(--text); }

  .room-card {
    display:flex; align-items:center; gap:16px; border:1px solid var(--card-border); border-radius:14px;
    padding:16px 18px; margin-bottom:10px; background: var(--card); transition: border-color .15s, background .15s;
  }
  .room-card:hover { border-color:#3a3a40; background:#1b1b1f; }
  .room-card .ico { width:42px; height:42px; border-radius:10px; background:#0c0c0d; border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center; color: var(--muted); font-size:16px; flex-shrink:0; }
  .room-card .info { flex:1; min-width:0; }
  .room-card .room-name { font-weight:700; font-size:17px; letter-spacing:-0.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .room-card .room-type { color: var(--muted); font-size:13px; margin-top:2px; }
  .room-card .actions { display:flex; gap:6px; align-items:center; flex-shrink:0; }
  .btn { display:inline-flex; align-items:center; gap:7px; font-size:14px; font-weight:600; padding:8px 14px; border-radius:8px;
    border:1px solid var(--card-border); background:#232327; color: var(--text); text-decoration:none; cursor:pointer; white-space:nowrap; }
  .btn:hover { background:#2c2c31; }
  .btn.primary { background: var(--accent-blue); border-color: var(--accent-blue); color:#fff; }
  .btn.primary:hover { filter: brightness(1.12); }
  .btn.icon { width:36px; padding:8px 0; justify-content:center; background:none; border-color:transparent; color: var(--muted); }
  .btn.icon:hover { color: var(--text); background:#232327; }
  .empty { color: var(--muted); text-align:center; padding:32px 0; border:1px dashed var(--card-border); border-radius:14px; font-size:15px; }

  .new-room { margin-top:40px; }
  .field { width:100%; background:#0c0c0d; color: var(--text); border:1px solid var(--card-border); border-radius:10px;
    padding:12px 14px; font-size:15px; margin-bottom:14px; outline:none; }
  .field:focus { border-color:#4a4a52; }
  .types { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
  @media (max-width:640px) { .types { grid-template-columns:1fr; } .room-card { flex-wrap:wrap; } }
  .type-option { position:relative; display:block; border:1px solid var(--card-border); border-radius:12px; padding:16px; background: var(--card); cursor:pointer; transition: border-color .15s, background .15s; }
  .type-option:hover { border-color:#3a3a40; }
  .type-option input { position:absolute; opacity:0; pointer-events:none; }
  .type-option .t { display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; margin-bottom:6px; }
  .type-option .t i { color: var(--muted); font-size:14px; width:16px; text-align:center; }
  .type-option .d { color: var(--muted); font-size:13px; line-height:1.55; }
  .type-option:has(input:checked) { border-color: var(--accent-blue); background: rgba(0,67,255,.07); }
  .type-option:has(input:checked) .t i { color: #6f95ff; }
  .create-row { display:flex; justify-content:flex-end; margin-top:16px; }
  .create-row .btn { font-size:15px; padding:11px 22px; }

  /* 확인 팝업 */
  .dlg-ov { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:100; }
  .dlg { width:360px; max-width:calc(100vw - 32px); background: var(--panel); border:1px solid var(--panel-border); border-radius:16px; padding:22px; }
  .dlg h3 { margin:0 0 6px; font-size:17px; }
  .dlg p { margin:0 0 18px; color: var(--muted); font-size:14.5px; line-height:1.55; }
  .dlg .row { display:flex; justify-content:flex-end; gap:8px; }
  .btn.danger { background:#3a1414; border-color:#5a2020; color:#ff9a9a; }
  .btn.danger:hover { background:#4a1818; }

  /* 스크롤바 공통 : 브라우저 기본(굵은 흰 바) 대신 화면 톤에 맞춘 얇고 어두운 바.
     평소엔 은은하게, 마우스를 올리면 조금 밝아집니다. 위아래 화살표 버튼은 없앱니다. */
  /* 크롬/엣지는 아래 ::-webkit-scrollbar 규칙만 쓰고(표준 속성을 같이 쓰면 화살표가 다시 생김), 파이어폭스만 표준 속성을 씁니다. */
  @supports not selector(::-webkit-scrollbar) {
    * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.16) transparent; }
  }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius:8px; border:2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.28); border:2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-button { display:none; width:0; height:0; }
  ::-webkit-scrollbar-corner { background: transparent; }

  /* ================================================================
     Science 커서 (by ScienceDiscoverer, rw-designer.com/cursor-set/science-cursors-animated · Public Domain) - .cur/.ani를 PNG로 변환해 씁니다.
     ================================================================ */
  :root { --cur-arrow: url("/static/cursors/normal_00.png") 0 0; }
  html, body, * { cursor: var(--cur-arrow), auto; }
  a, button, select, label, summary, [onclick], [role="button"],
  input[type="range"], input[type="checkbox"], input[type="color"], input[type="file"], input[type="radio"],
  [style*="cursor:pointer"], [style*="cursor: pointer"],
  .room-card .actions a,
  .room-card .actions button,
  .type-option {
    cursor: url("/static/cursors/pointer.png") 13 2, pointer !important; }
  input:not([type]), input[type="text"], input[type="number"], input[type="password"], input[type="search"],
  textarea, [contenteditable="true"] { cursor: url("/static/cursors/text.png") 16 16, text !important; }
  button:disabled, input:disabled, select:disabled, [disabled] { cursor: url("/static/cursors/not-allowed.png") 15 15, not-allowed !important; }
  [style*="cursor:default"], [style*="cursor: default"] { cursor: var(--cur-arrow), default !important; }
  [style*="cursor:help"], [data-tip-help] { cursor: url("/static/cursors/help.png") 0 0, help !important; }
  [style*="cursor:move"], [style*="cursor:grab"] { cursor: move !important; }
  [style*="cursor:crosshair"] { cursor: url("/static/cursors/crosshair.png") 16 16, crosshair !important; }
  body.is-busy, body.is-busy * { cursor: url("/static/cursors/wait.png") 16 16, wait !important; }

  /* ================================================================
     타이포그래피 : 크기 · 행간 · 자간을 함께 맞춥니다.
     한글은 기본 자간이 넓어 보여서 본문은 살짝, 제목은 더 좁히고
     행간은 본문 1.5 / 제목 1.2 정도로 정리합니다.
     ================================================================ */
  body { letter-spacing:-0.01em; line-height:1.5; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }
  input, textarea, select, button { letter-spacing:inherit; }

  /* 마우스 클릭 물결(Ripple) : 누른 자리에서 옅은 원이 퍼지며 사라집니다 */
  .click-ripple { position:fixed; left:0; top:0; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%;
    pointer-events:none; z-index:20000; border:1.5px solid rgba(255,255,255,.55); background:rgba(255,255,255,.08);
    animation: clickRipple .55s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes clickRipple { from { transform:scale(.4); opacity:1; } to { transform:scale(4.2); opacity:0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Rooms</h1>
    <p>기존 방으로 들어가거나 새 방을 만드세요. 방은 서버를 다시 켜도 그대로 남아 있어요.</p>
  </div>

  <div class="sec-title">방 목록 <span class="count">{{ rooms|length }}</span></div>
  {% if rooms %}
    {% for room in rooms %}
    <div class="room-card">
      <div class="ico"><i class="fa-solid {% if room.battle_type == 'siege' %}fa-chess-rook{% elif room.battle_type == 'mass_raid' %}fa-border-all{% else %}fa-people-arrows{% endif %}"></i></div>
      <div class="info">
        <div class="room-name">{{ room.name }}</div>
        <div class="room-type">{{ room.battle_type_label }}</div>
      </div>
      <div class="actions">
        <a class="btn primary" href="{{ room.gm_url }}"><i class="fa-solid fa-right-to-bracket"></i> 운영진 입장</a>
        <button type="button" class="btn" onclick="copyLink('{{ room.guest_url }}', this)"><i class="fa-solid fa-link"></i> <span>참가자 링크</span></button>
        <button type="button" class="btn icon" onclick="confirmDelete('{{ room.name }}', 'deleteForm-{{ room.id }}')"><i class="fa-solid fa-trash-can"></i></button>
      </div>
      <form method="post" action="/delete_room" id="deleteForm-{{ room.id }}" style="display:none;">
        <input type="hidden" name="room_id" value="{{ room.id }}">
        <input type="hidden" name="key" value="{{ room.gm_key }}">
      </form>
    </div>
    {% endfor %}
  {% else %}
    <div class="empty">아직 만든 방이 없어요. 아래에서 새 방을 만들어 보세요.</div>
  {% endif %}

  <div class="new-room">
    <div class="sec-title">새 방 만들기</div>
    <form method="post" action="/create_room">
      <input class="field" type="text" name="room_name" placeholder="방 이름 (비워두면 자동으로 지어요)" maxlength="30" autocomplete="off">
      <div class="types">
        <label class="type-option">
          <input type="radio" name="battle_type" value="pvp" checked>
          <div class="t"><i class="fa-solid fa-people-arrows"></i>PVP</div>
          <div class="d">러너 대 러너. 양쪽 팀 모두 참가자가 각자 캐릭터를 조작해요.</div>
        </label>
        <label class="type-option">
          <input type="radio" name="battle_type" value="siege">
          <div class="t"><i class="fa-solid fa-chess-rook"></i>공성전</div>
          <div class="d">GM이 거점을 조작하고, 러너 5~6인이 한 팀으로 맞서요.</div>
        </label>
        <label class="type-option">
          <input type="radio" name="battle_type" value="mass_raid">
          <div class="t"><i class="fa-solid fa-border-all"></i>마스 레이드</div>
          <div class="d">격자 지도에서 보스 대 러너 최대 30인. 민첩에 따라 1~6칸 이동해요.</div>
        </label>
      </div>
      <div class="create-row"><button type="submit" class="btn primary"><i class="fa-solid fa-plus"></i> 방 만들기</button></div>
    </form>
  </div>
</div>

<div class="dlg-ov" id="dlg" onclick="if(event.target===this) closeDlg()">
  <div class="dlg">
    <h3>방 삭제</h3>
    <p id="dlgMsg"></p>
    <div class="row">
      <button class="btn" onclick="closeDlg()">취소</button>
      <button class="btn danger" id="dlgOk">삭제</button>
    </div>
  </div>
</div>

<script>
function copyLink(url, btn) {
  navigator.clipboard.writeText(url).then(() => {
    const label = btn.querySelector('span');
    const original = label.textContent;
    label.textContent = '복사됨';
    setTimeout(() => { label.textContent = original; }, 1500);
  });
}
function confirmDelete(roomName, formId) {
  document.getElementById('dlgMsg').textContent = `"${roomName}" 방을 삭제할까요? 되돌릴 수 없어요.`;
  document.getElementById('dlgOk').onclick = () => document.getElementById(formId).submit();
  document.getElementById('dlg').style.display = 'flex';
}
function closeDlg() { document.getElementById('dlg').style.display = 'none'; }
</script>
<script>
// Science 커서 : 기본 화살표(원자 회전 20장면)를 50ms마다 바꿔서 움직이는 커서처럼 보이게 합니다.
// (브라우저는 .ani 움직이는 커서를 지원하지 않아서, 장면별 PNG를 CSS 변수로 갈아 끼웁니다)
(function animateArrowCursor() {
  const N = 20, MS = 50, root = document.documentElement;
  const urls = Array.from({ length: N }, (_, i) => `/static/cursors/normal_${String(i).padStart(2, '0')}.png`);
  urls.forEach(u => { const im = new Image(); im.src = u; });
  let i = 0;
  setInterval(() => {
    if (document.hidden) return;
    i = (i + 1) % N;
    root.style.setProperty('--cur-arrow', `url("${urls[i]}") 0 0`);
  }, MS);
})();
</script>
<script>
// 마우스 클릭 물결 효과
document.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  const r = document.createElement('span');
  r.className = 'click-ripple';
  r.style.left = e.clientX + 'px';
  r.style.top = e.clientY + 'px';
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 600);
}, true);
</script>
</body>
</html>
